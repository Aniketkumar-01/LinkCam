[package]
name = "linkcam-protocol"
version = "1.2.5"
edition = "2021"
description = "Core binary wire protocol, packet serialization, and control RPC for LinkCam"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
