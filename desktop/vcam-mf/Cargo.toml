[package]
name = "linkcam-vcam"
description = "LinkCam Windows 11 Media Foundation Virtual Camera COM In-Process Server"
version = "1.2.5"
edition = "2021"
publish = false

[lib]
name = "linkcam_vcam"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
