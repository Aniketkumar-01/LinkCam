name: 💡 Feature Request
description: Propose a new feature, improvement, or idea for LinkCam
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **LinkCam**! Suggest any new idea, codec support, or UX improvement.
  - type: dropdown
    id: category
    attributes:
      label: Target Feature Category
      description: What area does this feature relate to?
      options:
        - Video Quality & Codecs (AV1, VP9, Bitrate control)
        - Windows UI / Fluent 2 Experience
        - Android Camera Experience (Manual ISO/shutter, filters)
        - Document Scanner & PDF Generation
        - Performance & Battery Optimization
        - Audio Streaming & Mic Passthrough
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific problem or friction you experience?
      placeholder: "I find it frustrating when..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
