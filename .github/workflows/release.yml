name: Build and Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        env:
          KEY_PASS: ${{ secrets['ANDROID_KEYSTORE_PASSWORD'] }}
          KEY_ALIAS: ${{ secrets['ANDROID_KEY_ALIAS'] }}
          KEYSTORE_BASE64: ${{ secrets['ANDROID_KEYSTORE_BASE64'] }}
        run: |
          set -e
          cd android
          PASS="${KEY_PASS:-linkcam_release}"
          ALIAS="${KEY_ALIAS:-linkcam}"
          export ANDROID_KEYSTORE_PASSWORD="$PASS"
          export ANDROID_KEY_PASSWORD="$PASS"
          export ANDROID_KEY_ALIAS="$ALIAS"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            keytool -genkeypair -v -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=LinkCam, OU=Engineering, O=LinkCam, C=US"
          fi

          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p artifacts
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | grep -v "unsigned" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" artifacts/LinkCam-Android.apk
            ls -lh artifacts/LinkCam-Android.apk
          else
            echo "::error::No APK found in android/app/build/outputs/apk"
            find android -maxdepth 5 || true
            exit 1
          fi

      - name: Upload Android APK Asset
        uses: actions/upload-artifact@v7
        with:
          name: LinkCam-Android-APK
          path: artifacts/LinkCam-Android.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/LinkCam-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Web Frontend
        run: |
          cd desktop
          npm run build

      - name: Build Desktop Companion (Rust / Tauri)
        run: |
          cargo build --release --manifest-path desktop/src-tauri/Cargo.toml --verbose

      - name: Build DirectShow Virtual Camera Filter (64-bit DLL)
        shell: pwsh
        run: |
          cmake -B desktop/vcam-dshow/build -S desktop/vcam-dshow -A x64
          cmake --build desktop/vcam-dshow/build --config Release
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/target/release"
          Copy-Item "desktop/vcam-dshow/build/Release/LinkCamDShow64.dll" "desktop/src-tauri/target/release/LinkCamDShow64.dll"
          Write-Host "Successfully compiled and staged LinkCamDShow64.dll"

      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Inno Setup compiler path: $iscc"
          if (Test-Path $iscc) {
            & $iscc desktop/installer.iss
          } else {
            Write-Warning "ISCC.exe not found at standard path, attempting invocation from environment..."
            iscc desktop/installer.iss
          }

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "desktop/Output/LinkCam-Windows-Setup.exe") {
            Copy-Item "desktop/Output/LinkCam-Windows-Setup.exe" "artifacts/LinkCam-Windows-Setup.exe"
          }
          if (Test-Path "desktop/src-tauri/target/release/linkcam-desktop.exe") {
            Copy-Item "desktop/src-tauri/target/release/linkcam-desktop.exe" "artifacts/LinkCam-Windows-Portable.exe"
          }
          Get-ChildItem artifacts

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LinkCam-Windows-Binaries
          path: artifacts/*

      - name: Attach Windows Executables to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

