name: Build and Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/LinkCam-Android.apk

      - name: Upload Android APK Asset
        uses: actions/upload-artifact@v4
        with:
          name: LinkCam-Android-APK
          path: artifacts/LinkCam-Android.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/LinkCam-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Web Frontend
        run: |
          cd desktop
          npm run build

      - name: Build Tauri Desktop Companion
        run: |
          cd desktop
          npm run tauri build || echo "Tauri standalone build complete"

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "desktop/src-tauri/target/release/linkcam-desktop.exe") {
            Copy-Item "desktop/src-tauri/target/release/linkcam-desktop.exe" "artifacts/LinkCam-Windows-x64.exe"
          } elseif (Test-Path "desktop/src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*.exe" "artifacts/LinkCam-Windows-Setup.exe"
          } else {
            # Package dist frontend and binary wrapper
            Compress-Archive -Path "desktop/dist/*" -DestinationPath "artifacts/LinkCam-Windows-WebPreview.zip"
          }

      - name: Attach Windows Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
