name: Build and Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/LinkCam-Android.apk \;

      - name: Upload Android APK Asset
        uses: actions/upload-artifact@v4
        with:
          name: LinkCam-Android-APK
          path: artifacts/LinkCam-Android.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/LinkCam-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Web Frontend
        run: |
          cd desktop
          npm run build

      - name: Build Desktop Companion (Rust / Tauri)
        run: |
          cargo build --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc desktop/installer.iss
          }

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "desktop/Output/LinkCam-Windows-Setup.exe") {
            Copy-Item "desktop/Output/LinkCam-Windows-Setup.exe" "artifacts/LinkCam-Windows-Setup.exe"
          }
          if (Test-Path "desktop/src-tauri/target/release/linkcam-desktop.exe") {
            Copy-Item "desktop/src-tauri/target/release/linkcam-desktop.exe" "artifacts/LinkCam-Windows-Portable.exe"
          }

      - name: Attach Windows Executable to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
